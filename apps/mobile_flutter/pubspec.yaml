name: bom_mobile
description: "BOM(봄) - Flutter rewrite of the fertility tracking app frontend."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # Routing
  go_router: ^14.6.2

  # Networking
  dio: ^5.7.0

  # Storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3

  # Push notifications / local notifications
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.5
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4

  # In-app purchases
  purchases_flutter: ^8.4.4

  # Utilities
  intl: ^0.19.0
  share_plus: ^10.1.3
  url_launcher: ^6.3.1
  package_info_plus: ^8.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: Pretendard
      fonts:
        - asset: assets/fonts/PretendardStd-Regular.ttf
        - asset: assets/fonts/PretendardStd-Medium.ttf
          weight: 500
        - asset: assets/fonts/PretendardStd-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PretendardStd-Bold.ttf
          weight: 700
